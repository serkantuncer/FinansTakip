{% extends "base.html" %}

{% block title %}Şifremi Unuttum - Financial Portal{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-key fa-3x text-warning mb-3"></i>
                        <h2 class="card-title">Şifremi Unuttum</h2>
                        <p class="text-muted">Hesabınızı doğrulayıp yeni şifre belirleyin</p>
                    </div>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user me-2"></i>Kullanıcı Adı
                            </label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope me-2"></i>E-posta
                            </label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="new_password" class="form-label">
                                <i class="fas fa-lock me-2"></i>Yeni Şifre
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="new_password"
                                name="new_password"
                                minlength="6"
                                required
                            >
                            <div class="form-text">En az 6 karakter olmalıdır.</div>
                        </div>

                        <div class="mb-3">
                            <label for="new_password_confirm" class="form-label">
                                <i class="fas fa-lock me-2"></i>Yeni Şifre (Tekrar)
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="new_password_confirm"
                                name="new_password_confirm"
                                minlength="6"
                                required
                            >
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning btn-lg">
                                <i class="fas fa-sync-alt me-2"></i>Şifreyi Güncelle
                            </button>
                            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Girişe Dön
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const password = document.getElementById('new_password');
    const passwordConfirm = document.getElementById('new_password_confirm');

    function validatePassword() {
        if (password.value !== passwordConfirm.value) {
            passwordConfirm.setCustomValidity('Şifreler eşleşmiyor');
        } else {
            passwordConfirm.setCustomValidity('');
        }
    }

    password.addEventListener('change', validatePassword);
    passwordConfirm.addEventListener('keyup', validatePassword);
});
</script>
{% endblock %}
